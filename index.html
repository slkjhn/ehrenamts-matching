function evidence(i){return [0,1].map(k=>answers[k].reduce((s,j)=>Math.max(s,steps[k].items[j][2][i]),0))}
function candidates(){return answers[2].map(i=>{let [a,b]=evidence(i);return {i,a,b,s:a+b,strong:b>0&&(a+b>=3||(answers[0].includes(1)&&b===2))}}).sort((a,b)=>b.s-a.s)}
function finish(){extra=null;let c=candidates();shortlist=c.map(x=>x.i);stage=c.length===2&&c.every(x=>x.strong)&&Math.abs(c[0].s-c[1].s)<=1?5:6;render()}
function result(){let c=candidates(), strong=c.filter(x=>x.strong);if(extra>=0&&extra!==null)strong.sort((a,b)=>Number(b.i===extra)-Number(a.i===extra));return {ids:strong.map(x=>x.i),open:c.filter(x=>!x.strong).map(x=>x.i)}}

function card(i,confirmed){return `<article class="match-card" style="--accent:${accents[i]}"><div class="match-head"><span class="match-label">${confirmed?'Deine Möglichkeit':'Zum Kennenlernen'}</span><svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${pictograms[i]}</svg><h2>${roles[i][0]}</h2></div><div class="match-body"><p>${roles[i][1]}</p>${i<2?'<div class="tag">Hier suchen wir aktuell Unterstützung.</div>':''}</div></article>`}
function render(){let html='';if(!stage){html=`<div class="hero"><div class="muted">DEINE INTERESSEN · DEINE STÄRKEN · DEIN ENGAGEMENT</div><h1>Welches Ehrenamt passt zu dir?</h1><p>KulturLeben Leipzig & Region ermöglicht Menschen mit geringem Einkommen den kostenfreien Zugang zu Kultur- und Sportveranstaltungen in Leipzig und Umgebung.</p><p>Wir suchen Menschen, die uns auf vielfältige Weise unterstützen.</p><p>Entdecke, wie du deine Interessen, Stärken und Talente bei uns einbringen kannst.</p><button id="start">Starte deine Entdeckungsreise →</button><p class="muted">Etwa 2–3 Minuten · ganz unverbindlich</p></div>`}else if(stage<=4){let k=stage-1,t=steps[k],a=answers[k];html=`<nav class="progress" aria-label="Fortschritt">${['Interessen','Stärken','Aufgaben','Rahmenbedingungen'].map((x,i)=>`<span class="${i===k?'active':i<k?'done':''}">${i+1} · ${x}</span>`).join('')}</nav><div class="top"><h1>${t.title}</h1><span class="count" aria-live="polite">${a.length} ausgewählt</span></div><p>${t.intro}<br>${t.hint}${k===2?'<br><span class="muted">Deine Auswahl ist unverbindlich.</span>':''}</p><div class="grid">${t.items.map((x,i)=>`<button class="tile" data-i="${i}" aria-pressed="${a.includes(i)}" ${a.length>=t.max&&!a.includes(i)?'disabled':''}><span class="symbol" aria-hidden="true">${a.includes(i)?'✓':x[0]}</span>${x[1]}</button>`).join('')}</div><div class="actions"><button class="secondary" id="back">← Zurück</button><button id="next" ${!a.length?'disabled':''}>${stage===4?'Meine Möglichkeiten entdecken':'Weiter'} →</button></div>`}else if(stage===5){html=`<div class="muted">NOCH EIN KLEINER SCHRITT</div><h1>Was reizt dich am meisten?</h1><p>Beide Aufgaben passen zu deinen Antworten. Welche würde dir mehr Freude bereiten? Wähle <strong>eine Antwort</strong> aus.</p><div class="grid">${shortlist.map(i=>`<button class="tile" data-extra="${i}" aria-pressed="${extra===i}">${roles[i][2]}</button>`).join('')}<button class="tile" data-extra="-1" aria-pressed="${extra===-1}">Beides spricht mich gleichermaßen an.</button></div><div class="actions"><button class="secondary" id="back">← Zurück</button><button id="next" ${extra===null?'disabled':''}>Meine Möglichkeiten entdecken →</button></div>` }else{let {ids,open}=result();let heading=ids.length===2?'Zwei spannende Möglichkeiten für dich!':ids.length===1?'Das könnte dein Ehrenamt sein!':open.length===1?'Das könnte etwas für dich sein!':open.length===2?'Du bringst vielseitige Interessen und Stärken mit!':'Deine Möglichkeiten bei KulturLeben';let closing=ids.length===2?'Welche Aufgabe reizt dich mehr? Lass uns darüber sprechen!':ids.length===1?'Neugierig geworden? Lass uns darüber sprechen!':'Lass uns gemeinsam herausfinden, was zu dir passt!';html=`<section class="finale"><div class="center"><div class="spark" aria-hidden="true">✦ ✧ ✦</div><h1>${heading}</h1>${!ids.length?`<p class="muted">${open.length===1?'Entdecke, ob diese Aufgabe zu deinen Interessen und Stärken passt.':open.length===2?'Entdecke zwei Möglichkeiten, diese bei KulturLeben einzubringen.':'Lass uns gemeinsam herausfinden, wie du deine Interessen und Stärken bei uns einbringen kannst.'}</p>`:''}</div><div class="match-deck">${ids.map(i=>card(i,true)).join('')}${open.map(i=>card(i,false)).join('')}</div><div class="center"><h2 class="closing">${closing}</h2></div><div class="actions"><button class="secondary" id="edit">Auswahl ändern</button><button id="restart">Neues Matching starten</button></div></section>`}screen.innerHTML=html;let bind=(id,fn)=>{let b=document.getElementById(id);if(b)b.onclick=fn};bind('start',()=>{stage=1;render()});bind('back',()=>{if(stage===1)reset();else{stage--;render()}});bind('next',()=>{if(stage===4)finish();else{stage++;render()}});bind('edit',()=>{stage=1;extra=null;render()});bind('restart',reset);screen.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let k=stage-1,i=+b.dataset.i,a=answers[k];answers[k]=a.includes(i)?a.filter(x=>x!==i):steps[k].max===1?[i]:a.length<steps[k].max?[...a,i]:a;render();screen.querySelector(`[data-i="${i}"]`).focus()});screen.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{extra=+b.dataset.extra;render();screen.querySelector(`[data-extra="${extra}"]`).focus()});activity();window.scrollTo(0,0)}
['pointerdown','keydown','touchstart'].forEach(e=>document.addEventListener(e,activity,{passive:true}));render();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js').catch(function (error) {
      console.warn('Offline-Funktion konnte nicht aktiviert werden:', error);
    });
  });
}
</script></body></html>
